<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mom-i — AI 리포트 테스트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/report.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #7C3AED; --purple-lt: #F5F3FF; --purple-md: #EDE9FE; --purple-dk: #5B21B6;
      --mint: #10B981; --slate: #64748B; --slate-lt: #F8FAFC;
      --navy: #1E293B; --navy-lt: #334155; --border: #E9E3FF; --white: #FFFFFF;
      --red: #DC2626; --amber: #F59E0B;
    }

    body { font-family: 'Noto Sans KR', sans-serif; background: #EEEAF8; color: var(--navy); min-height: 100vh; padding: 16px 12px 60px; }

    /* ── 페이지 헤더 ── */
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 8px; }
    .page-header h1 { font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 800; color: var(--purple); }
    .page-header a { padding: 7px 14px; background: var(--navy); color: #fff; border-radius: 8px; font-size: 12px; font-weight: 700; text-decoration: none; white-space: nowrap; flex-shrink: 0; }

    /* ── 레이아웃 ── */
    .layout { display: flex; flex-direction: column; gap: 16px; max-width: 1200px; margin: 0 auto; }
    @media (min-width: 900px) {
      .layout { flex-direction: row; align-items: flex-start; }
      .panel-left { width: 360px; flex-shrink: 0; position: sticky; top: 16px; }
      .panel-right { flex: 1; min-width: 0; }
    }

    /* ── 입력 카드 ── */
    .card { background: var(--white); border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(124,58,237,.07); }
    .panel-left { display: flex; flex-direction: column; gap: 12px; }
    .card-title { font-size: 11px; font-weight: 800; color: var(--purple); letter-spacing: .5px; text-transform: uppercase; margin-bottom: 12px; }

    .field { margin-bottom: 8px; }
    .field:last-child { margin-bottom: 0; }
    label { display: block; font-size: 11px; font-weight: 600; color: var(--slate); margin-bottom: 3px; }
    input[type="text"], input[type="number"], input[type="date"] {
      width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px;
      font-size: 13px; font-family: inherit; color: var(--navy); background: var(--white);
    }
    input:focus { outline: none; border-color: var(--purple); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

    .sleep-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .sleep-table th { background: var(--slate-lt); padding: 5px 3px; font-size: 10px; font-weight: 700; color: var(--navy-lt); text-align: center; border-bottom: 1px solid var(--border); }
    .sleep-table td { padding: 3px 2px; text-align: center; }
    .sleep-table td.day-label { font-weight: 700; font-size: 12px; color: var(--navy); width: 24px; }
    .sleep-table input { padding: 4px 5px; font-size: 12px; text-align: center; }

    .run-btn { width: 100%; padding: 12px; background: var(--purple); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; font-family: inherit; transition: background .15s; }
    .run-btn:hover { background: var(--purple-dk); }
    .run-btn:disabled { background: #aaa; cursor: not-allowed; }
    .run-btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--slate); margin-top: -4px; }

    #status { font-size: 12px; color: var(--slate); text-align: center; min-height: 16px; }
    #status.err { color: var(--red); }
    #status.ok  { color: var(--mint); }

    /* ── 리포트 영역 ── */
    .a4 {
      background: var(--white); border-radius: 12px; padding: 24px 20px;
      box-shadow: 0 4px 24px rgba(124,58,237,.11);
      display: flex; flex-direction: column; gap: 16px; min-height: 400px;
    }
    @media (min-width: 600px) { .a4 { padding: 32px 36px; gap: 20px; } }

    .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; height: 300px; color: var(--slate); opacity: .5; }
    .placeholder .ph-icon { font-size: 40px; }
    .placeholder p { font-size: 13px; }

    /* 리포트 헤더 */
    .rep-header { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 12px; border-bottom: 2.5px solid var(--purple); gap: 8px; }
    .brand-name { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 800; color: var(--purple); }
    .brand-sub  { font-size: 10px; color: var(--slate); margin-top: 2px; }
    .header-info { text-align: right; }
    .header-main { font-size: 13px; font-weight: 800; line-height: 1.4; }
    .header-sub  { font-size: 10px; color: var(--slate); margin-top: 2px; }

    /* 리포트 본문 컨테이너 */
    #reportBody { display: flex; flex-direction: column; gap: 16px; }

    /* 리포트 푸터 */
    .rep-footer { padding-top: 10px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px; font-size: 10px; color: #94A3B8; }

    /* ── 인쇄 / PDF ── */
    @media print {
      body { background: #fff; padding: 0; }
      .page-header, .panel-left, #status { display: none !important; }
      .layout { display: block; }
      .panel-right { width: 100%; }
      .a4 { box-shadow: none; border-radius: 0; padding: 16px 24px; gap: 14px; min-height: unset; }
      .ai-sol-wrap, .kick-wrap { break-inside: avoid; }
      .tip-box { break-inside: avoid; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <h1>🌙 Mom-i AI 리포트 테스트</h1>
  <a href="/admin.html">← 관리자 홈</a>
</div>

<div class="layout">

  <div class="panel-left">
    <div class="card">
      <div class="card-title">👶 기본 정보</div>
      <div class="field">
        <label>기기 번호 (ser_no) — 비우면 월령 기반 자동 생성</label>
        <input id="serNo" type="text" placeholder="예: DEMO-7m" />
      </div>
      <div class="grid-2">
        <div class="field">
          <label>월령 (개월)</label>
          <input id="ageMonths" type="number" value="7" min="0" max="36" />
        </div>
        <div class="field">
          <label>주 시작일 (월요일)</label>
          <input id="weekStart" type="date" value="2026-04-14" />
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">😴 수면 데이터 (7일)</div>
      <table class="sleep-table">
        <thead><tr><th>요일</th><th>수면 (분)</th><th>뒤척임 (분)</th></tr></thead>
        <tbody id="sleepBody"></tbody>
      </table>
    </div>

    <div class="card">
      <div class="card-title">🌡️ 실내 환경</div>
      <div class="grid-3">
        <div class="field"><label>평균 온도</label><input id="tempAvg" type="number" step="0.1" value="22.0" /></div>
        <div class="field"><label>최고 온도</label><input id="tempMax" type="number" step="0.1" value="23.5" /></div>
        <div class="field"><label>최저 온도</label><input id="tempMin" type="number" step="0.1" value="21.5" /></div>
      </div>
      <div class="grid-2" style="margin-top:6px">
        <div class="field"><label>최대 소음 (dB)</label><input id="dbMax" type="number" value="58" /></div>
        <div class="field"><label>평균 소음 (dB)</label><input id="dbAvg" type="number" value="44" /></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">💨 호흡수 (회/분)</div>
      <div class="grid-3">
        <div class="field"><label>최소</label><input id="breathMin" type="number" value="22" /></div>
        <div class="field"><label>평균</label><input id="breathAvg" type="number" value="30" /></div>
        <div class="field"><label>최대</label><input id="breathMax" type="number" value="38" /></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🌡️ 체온 (°C)</div>
      <div class="grid-3">
        <div class="field"><label>최소</label><input id="btMin" type="number" step="0.1" value="36.3" /></div>
        <div class="field"><label>평균</label><input id="btAvg" type="number" step="0.1" value="36.7" /></div>
        <div class="field"><label>최고</label><input id="btMax" type="number" step="0.1" value="37.1" /></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📅 월간 집계 &amp; 이벤트</div>
      <div class="grid-2">
        <div class="field"><label>월간 평균 수면 (h)</label><input id="monthSleep" type="number" step="0.1" value="12.5" /></div>
        <div class="field"><label>월간 뒤척임 (h)</label><input id="monthRestless" type="number" step="0.1" value="0.5" /></div>
        <div class="field"><label>울음 감지 (회)</label><input id="cryCount" type="number" value="5" /></div>
        <div class="field"><label>카메라 이탈 (회)</label><input id="leaveCount" type="number" value="2" /></div>
      </div>
    </div>

    <div id="status"></div>
    <button class="run-btn" id="runBtn" onclick="runDemo()">✨ AI 리포트 생성</button>
    <button class="run-btn secondary" onclick="window.print()">🖨️ PDF 저장</button>
  </div>

  <div class="panel-right">
    <div id="report" class="a4">
      <div class="placeholder">
        <div class="ph-icon">🌙</div>
        <p>값을 입력하고 "AI 리포트 생성"을 누르세요.</p>
      </div>
    </div>
  </div>

</div>

<script src="/report-renderer.js"></script>
<script>
const DAYS = ['월','화','수','목','금','토','일'];
const SLEEP_DEFAULTS    = [710, 745, 630, 780, 700, 785, 690];
const RESTLESS_DEFAULTS = [25,  15,  55,  10,  35,  20,  40];

(function buildSleepTable() {
  const tbody = document.getElementById('sleepBody');
  DAYS.forEach((day, i) => {
    tbody.innerHTML += `
      <tr>
        <td class="day-label">${day}</td>
        <td><input type="number" id="sleep_${i}" value="${SLEEP_DEFAULTS[i]}" min="0" max="1440" /></td>
        <td><input type="number" id="restless_${i}" value="${RESTLESS_DEFAULTS[i]}" min="0" max="300" /></td>
      </tr>`;
  });
})();

function v(id) { return document.getElementById(id).value; }
function n(id) { return Number(v(id)); }

function setStatus(msg, cls = '') {
  const el = document.getElementById('status');
  el.textContent = msg; el.className = cls;
}

function buildRequest() {
  const weekStartStr = v('weekStart');
  const [wy, wm, wd] = weekStartStr.split('-').map(Number);
  const sleep = DAYS.map((_, i) => {
    const d = new Date(wy, wm-1, wd+i);
    const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    return { date: dateStr, sleep_min: n(`sleep_${i}`), restless_min: n(`restless_${i}`) };
  });
  return {
    ser_no:          v('serNo').trim() || `DEMO-${n('ageMonths')}m`,
    baby_age_months: n('ageMonths'),
    week_start:      weekStartStr,
    sleep,
    environment: { temp_avg: n('tempAvg'), temp_max: n('tempMax'), temp_min: n('tempMin'), db_max: n('dbMax'), db_avg: n('dbAvg') },
    breath:      { breath_min: n('breathMin'), breath_max: n('breathMax'), breath_avg: n('breathAvg') },
    body_temp:   { body_temp_min: n('btMin'), body_temp_max: n('btMax'), body_temp_avg: n('btAvg') },
    monthly:     { month_sleep_h: n('monthSleep'), month_restless_h: n('monthRestless') },
    events:      { cry_count: n('cryCount'), leave_count: n('leaveCount') },
  };
}

function buildMeta(req) {
  const [wy, wm, wd] = req.week_start.split('-').map(Number);
  const ws = new Date(wy, wm-1, wd);
  const we = new Date(wy, wm-1, wd+6);
  const fmt = d => `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  return {
    ageMonths: req.baby_age_months,
    weekNum:   Math.floor((ws.getDate()-1)/7) + 1,
    weekStart: fmt(ws),
    weekEnd:   fmt(we),
    generated: fmt(new Date()),
  };
}

async function runDemo() {
  const btn = document.getElementById('runBtn');
  btn.disabled = true; btn.textContent = '⏳ Gemini 분석 중...';
  setStatus('요청 중 — 10~20초 소요될 수 있습니다.');

  try {
    const req = buildRequest();
    const res = await fetch('http://localhost:8000/api/v1/reports/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': 'dev-local-key' },
      body: JSON.stringify(req),
    });
    if (!res.ok) throw new Error(`서버 오류 ${res.status}: ${await res.text()}`);

    const rj   = await res.json();
    const meta = buildMeta(req);

    document.getElementById('report').innerHTML = `
      <div class="rep-header">
        <div>
          <div class="brand-name">Mom-i</div>
          <div class="brand-sub">프리미엄 수면 교육 가이드</div>
        </div>
        <div class="header-info">
          <div class="header-main">아기 (${meta.ageMonths}개월) · ${meta.weekNum}주차</div>
          <div class="header-sub">${meta.weekStart} ~ ${meta.weekEnd}</div>
        </div>
      </div>
      <div id="reportBody"></div>
      <div class="rep-footer">
        <span>Mom-i © 2026 · 본 가이드라인은 의학적 진단을 대체하지 않습니다.</span>
        <span>생성일: ${meta.generated}</span>
      </div>
    `;

    renderReportBody(document.getElementById('reportBody'), rj, {
      radarId:   'radarChart',
      barId:     'dailyBarChart',
      showTrend: false,
    });

    setStatus('✅ AI 리포트 생성 완료', 'ok');
  } catch (e) {
    setStatus(`오류: ${e.message}`, 'err');
  } finally {
    btn.disabled = false; btn.textContent = '✨ AI 리포트 생성';
  }
}
</script>
</body>
</html>
