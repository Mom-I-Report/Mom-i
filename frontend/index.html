<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M-Take 리포트 미리보기</title>
  <style>
    /* ── 기본 ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:    #4f86f7;
      --blue-lt: #eef3ff;
      --blue-dk: #2f5fd4;
      --gray:    #888;
      --border:  #e3e8f0;
      --text:    #1a1a2e;
      --text-sm: #555;
      --green:   #3bb07a;
      --red:     #e05c5c;
      --bg:      #f0f4fb;
    }

    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── 레이아웃 ── */
    .app {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: 100vh;
    }

    /* ── 사이드 패널 (입력) ── */
    .side {
      background: #fff;
      border-right: 1px solid var(--border);
      padding: 28px 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .side-logo {
      font-size: 20px;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .side-logo span { font-size: 11px; font-weight: 400; color: var(--gray); }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 12px; color: var(--text-sm); font-weight: 500; }
    .field input, .field select {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    .field input:focus, .field select:focus { border-color: var(--blue); }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .day-grid {
      display: grid;
      grid-template-columns: 32px 1fr 1fr;
      gap: 4px 6px;
      align-items: center;
    }
    .day-grid .day-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--blue);
      text-align: center;
      background: var(--blue-lt);
      border-radius: 4px;
      padding: 4px 0;
    }
    .day-grid input {
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 7px;
      font-size: 12px;
      outline: none;
      transition: border-color .15s;
    }
    .day-grid input:focus { border-color: var(--blue); }
    .day-grid .col-header {
      font-size: 10px;
      color: var(--gray);
      text-align: center;
    }

    .dummy-btn {
      width: 100%;
      padding: 7px;
      border: 1px dashed var(--blue);
      border-radius: 6px;
      background: var(--blue-lt);
      color: var(--blue);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .dummy-btn:hover { background: #d9e8ff; }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--blue);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s;
      margin-top: auto;
    }
    .submit-btn:hover { background: var(--blue-dk); }
    .submit-btn:disabled { background: #b0c4ef; cursor: not-allowed; }

    /* ── 메인 (리포트) ── */
    .main {
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
    }

    /* 빈 상태 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--gray);
      min-height: 400px;
    }
    .empty-state .icon { font-size: 52px; opacity: .35; }
    .empty-state p { font-size: 14px; }

    /* 로딩 */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      color: var(--blue);
      min-height: 400px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--blue-lt);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── A4 리포트 ── */
    .a4 {
      width: 794px;      /* 210mm @96dpi */
      min-height: 1123px; /* 297mm */
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 4px 32px rgba(0,0,0,.12);
      padding: 52px 56px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* 헤더 */
    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 2.5px solid var(--blue);
      padding-bottom: 14px;
    }
    .report-brand { font-size: 26px; font-weight: 800; color: var(--blue); letter-spacing: -1px; }
    .report-brand sub { font-size: 11px; font-weight: 400; color: var(--gray); margin-left: 4px; }
    .report-meta { text-align: right; }
    .report-meta .week { font-size: 15px; font-weight: 700; color: var(--text); }
    .report-meta .sub  { font-size: 11px; color: var(--gray); margin-top: 2px; }

    /* 섹션 제목 */
    .sec-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--blue);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sec-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* 요약 카드 */
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .card {
      background: var(--blue-lt);
      border-radius: 10px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card.highlight { background: var(--blue); color: #fff; }
    .card-label { font-size: 10px; font-weight: 600; opacity: .7; text-transform: uppercase; letter-spacing: .4px; }
    .card-value { font-size: 22px; font-weight: 800; line-height: 1; }
    .card-unit  { font-size: 11px; opacity: .75; }

    /* 환경 */
    .env-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .env-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .env-item .label { font-size: 11px; color: var(--gray); }
    .env-item .val   { font-size: 14px; font-weight: 700; color: var(--text); }

    /* 일별 바 */
    .daily-bars { display: flex; gap: 6px; align-items: flex-end; height: 100px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .bar-wrap { width: 100%; flex: 1; display: flex; align-items: flex-end; }
    .bar {
      width: 100%;
      background: var(--blue);
      border-radius: 4px 4px 0 0;
      position: relative;
      min-height: 4px;
      transition: height .4s ease;
    }
    .bar.has-restless::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      border-radius: 4px 4px 0 0;
      background: rgba(255,255,255,.35);
    }
    .bar-day  { font-size: 11px; font-weight: 600; color: var(--gray); }
    .bar-val  { font-size: 10px; color: var(--text-sm); }

    /* 트렌드 */
    .trend-row { display: flex; gap: 10px; }
    .trend-item {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .trend-label { font-size: 10px; color: var(--gray); font-weight: 600; }
    .trend-val   { font-size: 18px; font-weight: 800; }
    .trend-val.up   { color: var(--green); }
    .trend-val.down { color: var(--red); }
    .trend-val.flat { color: var(--gray); }

    /* AI 코멘트 */
    .ai-box {
      background: var(--blue-lt);
      border-left: 3px solid var(--blue);
      border-radius: 0 8px 8px 0;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .ai-section h4 {
      font-size: 12px;
      font-weight: 700;
      color: var(--blue-dk);
      margin-bottom: 5px;
    }
    .ai-section p {
      font-size: 13px;
      line-height: 1.75;
      color: var(--text);
    }

    /* 푸터 */
    .report-footer {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--gray);
      display: flex;
      justify-content: space-between;
    }

    /* 에러 */
    .error-box {
      background: #fff0f0;
      border: 1px solid #f5c0c0;
      border-radius: 8px;
      padding: 14px 18px;
      color: var(--red);
      font-size: 13px;
      max-width: 600px;
      width: 100%;
    }

    @media print {
      .side { display: none; }
      .main { padding: 0; }
      .a4   { box-shadow: none; border-radius: 0; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ── 사이드 입력 패널 ── -->
  <aside class="side">
    <div class="side-logo">M-Take <span>리포트 미리보기</span></div>

    <!-- 기본 정보 -->
    <div>
      <div class="section-title">기본 정보</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="field">
          <label>시리얼 번호 (ser_no)</label>
          <input id="ser_no" value="MT-00123" />
        </div>
        <div class="row2">
          <div class="field">
            <label>월령 (개월)</label>
            <input id="age" type="number" value="8" min="0" max="36" />
          </div>
          <div class="field">
            <label>주 시작일</label>
            <input id="week_start" type="date" />
          </div>
        </div>
      </div>
    </div>

    <!-- 일별 수면 -->
    <div>
      <div class="section-title">일별 수면 데이터</div>
      <div class="day-grid">
        <div></div>
        <div class="col-header">수면(분)</div>
        <div class="col-header">뒤척임(분)</div>
        <template id="day-tmpl">
          <div class="day-label"></div>
          <input type="number" class="sleep-min" placeholder="540" />
          <input type="number" class="restless-min" placeholder="20" />
        </template>
      </div>
      <div id="day-rows" class="day-grid" style="margin-top:4px"></div>
      <button class="dummy-btn" style="margin-top:8px" onclick="fillDummy()">더미 데이터 채우기</button>
    </div>

    <!-- 환경 -->
    <div>
      <div class="section-title">환경 데이터</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div class="row2">
          <div class="field"><label>평균 온도(°C)</label><input id="temp_avg" type="number" step=".1" value="23.1" /></div>
          <div class="field"><label>최고 온도(°C)</label><input id="temp_max" type="number" step=".1" value="24.5" /></div>
        </div>
        <div class="row2">
          <div class="field"><label>최저 온도(°C)</label><input id="temp_min" type="number" step=".1" value="21.8" /></div>
          <div class="field"><label>최대 소음(dB)</label><input id="db_max" type="number" value="62" /></div>
        </div>
        <div class="field"><label>평균 소음(dB)</label><input id="db_avg" type="number" value="48" /></div>
      </div>
    </div>

    <!-- 이벤트 -->
    <div>
      <div class="section-title">이벤트</div>
      <div class="row2">
        <div class="field"><label>울음 횟수</label><input id="cry_count" type="number" value="3" /></div>
        <div class="field"><label>카메라 이탈</label><input id="leave_count" type="number" value="1" /></div>
      </div>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="submitReport()">리포트 생성</button>
  </aside>

  <!-- ── 메인 리포트 영역 ── -->
  <main class="main" id="main">
    <div class="empty-state">
      <div class="icon">📋</div>
      <p>데이터를 입력하고 리포트를 생성하세요</p>
    </div>
  </main>

</div>

<script>
const DAYS = ['월','화','수','목','금','토','일'];
const API  = 'http://localhost:8000/api/v1/report/generate';

/* ── 초기화 ── */
(function init() {
  // 이번 주 월요일 기본값
  const today = new Date();
  const mon   = new Date(today);
  mon.setDate(today.getDate() - today.getDay() + (today.getDay() === 0 ? -6 : 1));
  document.getElementById('week_start').value = mon.toISOString().slice(0,10);

  // 일별 행 생성
  const container = document.getElementById('day-rows');
  DAYS.forEach(day => {
    const label = document.createElement('div');
    label.className = 'day-label';
    label.textContent = day;

    const sleep = document.createElement('input');
    sleep.type = 'number'; sleep.className = 'sleep-min'; sleep.placeholder = '540';

    const restless = document.createElement('input');
    restless.type = 'number'; restless.className = 'restless-min'; restless.placeholder = '20';

    container.appendChild(label);
    container.appendChild(sleep);
    container.appendChild(restless);
  });
})();

/* ── 더미 데이터 채우기 ── */
function fillDummy() {
  const sleeps    = [570, 540, 600, 510, 580, 560, 590];
  const restless  = [22, 30, 15, 35, 20, 25, 18];
  document.querySelectorAll('.sleep-min').forEach((el, i)   => el.value = sleeps[i]);
  document.querySelectorAll('.restless-min').forEach((el, i) => el.value = restless[i]);
}

/* ── 리포트 생성 요청 ── */
async function submitReport() {
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = '생성 중…';

  const weekStart = document.getElementById('week_start').value;
  const baseDate  = new Date(weekStart);

  const sleepEls    = document.querySelectorAll('.sleep-min');
  const restlessEls = document.querySelectorAll('.restless-min');

  const sleep = DAYS.map((_, i) => {
    const d = new Date(baseDate);
    d.setDate(baseDate.getDate() + i);
    return {
      date:         d.toISOString().slice(0,10),
      sleep_min:    parseInt(sleepEls[i].value)    || 540,
      restless_min: parseInt(restlessEls[i].value) || 20,
    };
  });

  const body = {
    ser_no:          document.getElementById('ser_no').value.trim(),
    baby_age_months: parseInt(document.getElementById('age').value) || 8,
    week_start:      weekStart,
    sleep,
    environment: {
      temp_avg:  parseFloat(document.getElementById('temp_avg').value),
      temp_max:  parseFloat(document.getElementById('temp_max').value),
      temp_min:  parseFloat(document.getElementById('temp_min').value),
      db_max:    parseInt(document.getElementById('db_max').value),
      db_avg:    parseInt(document.getElementById('db_avg').value),
    },
    events: {
      cry_count:   parseInt(document.getElementById('cry_count').value),
      leave_count: parseInt(document.getElementById('leave_count').value),
    },
  };

  setMain('<div class="loading"><div class="spinner"></div><p>AI 리포트 생성 중…</p></div>');

  try {
    const res  = await fetch(API, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }
    const data = await res.json();
    renderReport(data);
  } catch (e) {
    setMain(`<div class="error-box">⚠️ 오류: ${e.message}</div>`);
  } finally {
    btn.disabled = false; btn.textContent = '리포트 생성';
  }
}

/* ── 리포트 렌더링 ── */
function renderReport(d) {
  const s = d.summary;
  const generatedAt = new Date(d.generated_at).toLocaleDateString('ko-KR', {
    year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit'
  });

  /* 일별 바 */
  const maxSleep = Math.max(...d.daily.map(x => x.sleep_h));
  const bars = d.daily.map(day => {
    const pct = Math.round((day.sleep_h / (maxSleep || 1)) * 80);
    return `
      <div class="bar-col">
        <div class="bar-wrap">
          <div class="bar" style="height:${pct}px" title="${day.sleep_h}h / 뒤척임 ${day.restless_min}분"></div>
        </div>
        <div class="bar-day">${day.day}</div>
        <div class="bar-val">${day.sleep_h}h</div>
      </div>`;
  }).join('');

  /* 트렌드 */
  let trendHtml = '';
  if (d.trend) {
    const t = d.trend;
    trendHtml = `
      <div>
        <div class="sec-title">주간 변화</div>
        <div class="trend-row">
          ${trendItem('평균 수면', t.sleep_vs_last_week, 'h', true)}
          ${trendItem('뒤척임', t.restless_vs_last_week, '분', false)}
          ${trendItem('울음', t.cry_vs_last_week, '회', false)}
        </div>
      </div>`;
  }

  /* AI 코멘트 파싱 (### 섹션으로 분리) */
  const aiSections = parseAiComment(d.ai_comment);

  const html = `
  <div class="a4">

    <!-- 헤더 -->
    <div class="report-header">
      <div class="report-brand">M-Take <sub>수면 리포트</sub></div>
      <div class="report-meta">
        <div class="week">${d.week_label}</div>
        <div class="sub">생성일: ${generatedAt} | SN: ${d.ser_no}</div>
      </div>
    </div>

    <!-- 요약 카드 -->
    <div>
      <div class="sec-title">주간 요약</div>
      <div class="summary-cards">
        <div class="card highlight">
          <div class="card-label">평균 수면</div>
          <div class="card-value">${s.avg_sleep_h}</div>
          <div class="card-unit">시간 / 일</div>
        </div>
        <div class="card">
          <div class="card-label">평균 뒤척임</div>
          <div class="card-value">${s.avg_restless_min}</div>
          <div class="card-unit">분 / 일</div>
        </div>
        <div class="card">
          <div class="card-label">울음 이벤트</div>
          <div class="card-value">${s.cry_count}</div>
          <div class="card-unit">회</div>
        </div>
        <div class="card">
          <div class="card-label">카메라 이탈</div>
          <div class="card-value">${s.leave_count}</div>
          <div class="card-unit">회</div>
        </div>
      </div>
    </div>

    <!-- 환경 -->
    <div>
      <div class="sec-title">수면 환경</div>
      <div class="env-row">
        <div class="env-item">
          <span class="label">평균 온도</span>
          <span class="val">${s.temp_avg}°C</span>
        </div>
        <div class="env-item">
          <span class="label">소음 최대</span>
          <span class="val">${s.db_max} dB</span>
        </div>
        <div class="env-item">
          <span class="label">기기 이탈</span>
          <span class="val">${s.leave_count}회</span>
        </div>
      </div>
    </div>

    <!-- 일별 수면 -->
    <div>
      <div class="sec-title">일별 수면</div>
      <div class="daily-bars">${bars}</div>
    </div>

    <!-- 트렌드 -->
    ${trendHtml}

    <!-- AI 코멘트 -->
    <div>
      <div class="sec-title">AI 분석 코멘트</div>
      <div class="ai-box">${aiSections}</div>
    </div>

    <!-- 푸터 -->
    <div class="report-footer">
      <span>M-Take © 2026 — AI 분석 결과로 의학적 진단을 대체하지 않습니다</span>
      <span>생후 ${d.summary ? '' : ''}${document.getElementById('age').value}개월</span>
    </div>

  </div>`;

  setMain(html);
}

/* ── 트렌드 아이템 ── */
function trendItem(label, val, unit, higherIsGood) {
  const better = higherIsGood ? val > 0 : val < 0;
  const cls    = val === 0 ? 'flat' : (better ? 'up' : 'down');
  const arrow  = val === 0 ? '─' : (val > 0 ? '▲' : '▼');
  const sign   = val > 0 ? '+' : '';
  return `
    <div class="trend-item">
      <div class="trend-label">${label}</div>
      <div class="trend-val ${cls}">${arrow} ${sign}${val}${unit}</div>
    </div>`;
}

/* ── AI 코멘트를 ### 섹션으로 파싱 ── */
function parseAiComment(text) {
  if (!text) return '<p>생성된 코멘트가 없습니다.</p>';

  // ### 로 시작하는 섹션 분리
  const parts = text.split(/(?=###\s)/);
  return parts.map(part => {
    part = part.trim();
    if (!part) return '';
    const headMatch = part.match(/^###\s+(.+)\n([\s\S]*)/);
    if (headMatch) {
      const title   = headMatch[1].trim();
      const content = headMatch[2].trim().replace(/\n/g, '<br/>');
      return `<div class="ai-section"><h4>${title}</h4><p>${content}</p></div>`;
    }
    return `<div class="ai-section"><p>${part.replace(/\n/g,'<br/>')}</p></div>`;
  }).join('');
}

/* ── 메인 영역 교체 ── */
function setMain(html) {
  document.getElementById('main').innerHTML = html;
}
</script>
