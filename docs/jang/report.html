<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mom-i 수면 리포트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple:    #7C3AED;
      --purple-lt: #F5F3FF;
      --purple-md: #EDE9FE;
      --purple-dk: #5B21B6;
      --mint:      #10B981;
      --slate:     #64748B;
      --slate-lt:  #F8FAFC;
      --navy:      #1E293B;
      --navy-lt:   #334155;
      --border:    #E9E3FF;
      --white:     #FFFFFF;
    }

    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background: #EEEAF8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      color: var(--navy);
    }

    /* ── 컨트롤 바 ── */
    .ctrl {
      width: 794px;
      max-width: 100%;
      background: var(--white);
      border-radius: 10px;
      padding: 11px 18px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 10px rgba(124,58,237,.08);
    }
    .ctrl span { flex:1; font-size:13px; color:var(--slate); font-weight:500; }
    .ctrl button {
      padding: 8px 18px;
      background: var(--purple);
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s;
    }
    .ctrl button:hover { background: var(--purple-dk); }

    /* ── A4 용지 ── */
    .a4 {
      width: 794px;
      max-width: 100%;
      min-height: 1123px;
      background: var(--white);
      border-radius: 8px;
      box-shadow: 0 6px 32px rgba(124,58,237,.13);
      padding: 42px 52px 38px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* ── 헤더 ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 14px;
      border-bottom: 2.5px solid var(--purple);
    }
    .brand-name {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--purple);
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .brand-sub { font-size: 11px; color: var(--slate); margin-top: 4px; }
    .header-info { text-align: right; }
    .header-main { font-size: 16px; font-weight: 800; color: var(--navy); }
    .header-sub  { font-size: 11px; color: var(--slate); margin-top: 4px; }

    /* ── 공통 섹션 타이틀 ── */
    .sec-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 12px;
    }

    /* ── 상단 콤팩트 데이터 영역 (그리드) ── */
    .top-data-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--slate-lt);
      border-radius: 12px;
      padding: 16px;
    }

    /* 통계 영역 압축 버전 */
    .compact-stats {
      display: flex;
      flex-direction: row;
      gap: 10px;
    }
    .c-stat-row {
      flex: 1;
      display: flex;
      align-items: center;
      background: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      border-left: 3px solid var(--purple);
      box-shadow: 0 1px 2px rgba(0,0,0,.02);
    }
    .c-stat-row.mint { border-left-color: var(--mint); }
    .c-stat-icon   { font-size: 15px; margin-right: 10px;}
    .c-stat-label  { flex: 1; font-size: 11px; color: var(--slate); font-weight: 600; }
    .c-stat-value  { font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 800; color: var(--navy); }

    /* 콤팩트 테이블 */
    .compact-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 11px;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.02);
    }
    .compact-table th, .compact-table td {
      padding: 8px 4px;
      border-bottom: 1px solid var(--slate-lt);
    }
    .compact-table tr:last-child td { border-bottom: none; }
    .compact-table th { background: #F1F5F9; font-weight: 700; color: var(--navy-lt); }
    .compact-table td { color: var(--navy); font-family: 'Outfit', sans-serif; font-weight: 500; }
    .compact-table td.td-day { font-family: 'Noto Sans KR', sans-serif; font-weight: 700; text-align: left; padding-left: 14px; }
    .compact-table td.td-temp-high { color: #D25E4A; font-weight: 700; }


    /* ── ✨ 메인 AI 수면 교육 솔루션 (Kick) ── */
    .ai-sol-wrap {
      background: linear-gradient(180deg, var(--white) 0%, var(--purple-lt) 100%);
      border: 1px solid var(--purple-md);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 14px rgba(124,58,237,.06);
    }
    .ai-badge {
      display: inline-block;
      background: var(--purple);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 99px;
      letter-spacing: .5px;
      margin-bottom: 12px;
    }
    .ai-sol-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .ai-sol-reason {
      font-size: 13px;
      color: var(--navy-lt);
      line-height: 1.6;
      background: rgba(255,255,255,0.7);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 3px solid var(--purple-dk);
    }
    .ai-steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .ai-step {
      display: flex;
      gap: 14px;
      background: #fff;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--white);
      box-shadow: 0 1px 3px rgba(0,0,0,.03);
    }
    .step-num {
      width: 28px;
      height: 28px;
      background: var(--purple-md);
      color: var(--purple-dk);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 14px;
      flex-shrink: 0;
    }
    .step-text {
      font-size: 13px;
      color: var(--navy);
      line-height: 1.6;
      font-weight: 500;
      padding-top: 4px;
    }
    .step-text strong {
      color: var(--purple-dk);
      font-weight: 800;
    }

    /* ── 💡 월령별 케어 킥 (Insight) ── */
    .kick-wrap {
      display: flex;
      gap: 18px;
      background: #FFFBEB; /* 연한 노란색 톤 */
      border: 1px solid #FEF3C7;
      border-radius: 14px;
      padding: 20px 24px;
    }
    .kick-icon {
      font-size: 32px;
      flex-shrink: 0;
    }
    .kick-content {}
    .kick-title {
      font-size: 15px;
      font-weight: 800;
      color: #92400E;
      margin-bottom: 6px;
    }
    .kick-text {
      font-size: 13px;
      color: #B45309;
      line-height: 1.65;
    }

    /* ── 📉 데이터 맞춤 분석 팁 ── */
    .data-tips-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tip-box {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 20px;
      border-radius: 12px;
      border-left: 4px solid transparent;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.03);
    }
    .tip-box.caution { border-left-color: #F59E0B; background: #FFFBEB; }
    .tip-box.good { border-left-color: #10B981; background: #ECFDF5; }
    
    .tip-icon { font-size: 24px; flex-shrink: 0; margin-top: 2px; }
    .tip-content {}
    .tip-title { font-size: 14px; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
    .tip-text { font-size: 12.5px; color: var(--navy-lt); line-height: 1.6; }

    /* ── 광고 배너 ── */
    .ad {
      margin-top: auto;
      background: linear-gradient(135deg, #1E293B 0%, #334155 100%);
      border-radius: 10px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .ad::after {
      content: '';
      position: absolute;  right: -24px; top: -24px;
      width: 90px; height: 90px;
      border-radius: 50%;
      background: rgba(255,255,255,.05);
    }
    .ad-tag { position: absolute; top: 7px; right: 12px; font-size: 9px; color: rgba(255,255,255,.3); font-weight: 600; }
    .ad-main { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
    .ad-sub  { font-size: 11px; color: rgba(255,255,255,.55); }
    .ad-btn  {
      padding: 8px 16px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 7px;
      background: rgba(255,255,255,.12);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      backdrop-filter: blur(4px);
    }
    
    /* ── 푸터 ── */
    .footer {
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #94A3B8;
    }

    /* ── 인쇄용 ── */
    @media print {
      body { background: #fff; padding: 0; }
      .ctrl { display: none; }
      .a4 { box-shadow: none; border-radius: 0; padding: 15px 32px; width: 100%; min-height: auto; gap: 14px;}
      .ai-sol-wrap, .kick-wrap, .tip-box { page-break-inside: avoid; }
    }
  </style>
</head>
<body>

<!-- 컨트롤 바 -->
<div class="ctrl">
  <span>📄 Mom-i 수면 교육 가이드 리포트 미리보기</span>
  <button onclick="window.print()">🖨️ PDF 저장 / 인쇄</button>
</div>

<!-- A4 리포트 -->
<div class="a4">

  <!-- 헤더 -->
  <div class="header">
    <div>
      <div class="brand-name">Mom-i</div>
      <div class="brand-sub">프리미엄 수면 교육 가이드</div>
    </div>
    <div class="header-info">
      <div class="header-main" id="hd-title">—</div>
      <div class="header-sub" id="hd-sub">—</div>
    </div>
  </div>

  <!-- 데이터 섹션 (콤팩트 그리드) -->
  <div class="top-data-grid">
    <div class="compact-stats">
      <div class="c-stat-row">
        <span class="c-stat-icon">😴</span>
        <span class="c-stat-label">평균 수면</span>
        <span class="c-stat-value" id="s-sleep">—</span>
      </div>
      <div class="c-stat-row mint">
        <span class="c-stat-icon">🌙</span>
        <span class="c-stat-label">평균 취침</span>
        <span class="c-stat-value" id="s-bed">—</span>
      </div>
      <div class="c-stat-row">
        <span class="c-stat-icon">🌡️</span>
        <span class="c-stat-label">평균 온도</span>
        <span class="c-stat-value" id="s-temp">—</span>
      </div>
    </div>

    <div>
      <table class="compact-table">
        <thead>
          <tr>
            <th style="padding-left:14px; text-align:left;">요일</th>
            <th>수면 구간 (취침~기상)</th>
            <th>총 수면 시간</th>
            <th>뒤척임 (발생 시각)</th>
            <th>뒤척임 (횟수 / 총 시간)</th>
            <th>온도</th>
          </tr>
        </thead>
        <tbody id="data-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- ✨ 핵심: AI 수면 교육 솔루션 -->
  <div class="ai-sol-wrap">
    <div class="ai-sol-title" id="ai-sol-title">—</div>
    <div class="ai-sol-reason" id="ai-sol-reason">—</div>
    
    <div class="ai-steps" id="ai-steps">
      <!-- Steps will be injected here -->
    </div>
  </div>

  <!-- 📉 데이터 맞춤 분석 팁 -->
  <div class="data-tips-wrap" id="data-tips">
    <!-- Tips will be injected here -->
  </div>

  <!-- 💡 핵심: 월령별 케어 킥 -->
  <div class="kick-wrap">
    <div class="kick-icon">💡</div>
    <div class="kick-content">
      <div class="kick-title" id="kick-title">—</div>
      <div class="kick-text" id="kick-text">—</div>
    </div>
  </div>

  <!-- 광고 배너 -->
  <div class="ad">
    <div class="ad-tag">AD</div>
    <div>
      <div class="ad-main">👶 맘스홀릭 프리미엄 백색소음기</div>
      <div class="ad-sub">쉬닥법 성공률을 높여주는 맞춤 주파수 오디오 가이드 탑재</div>
    </div>
    <button class="ad-btn">자세히 보기</button>
  </div>

  <!-- 푸터 -->
  <div class="footer">
    <span>Mom-i © 2026 · 본 리포트의 가이드라인은 의학적 진단을 대체하지 않습니다.</span>
    <span id="footer-r">—</span>
  </div>

</div>

<script>
/* ══════════════════
   더미 데이터 (AI 중심 킥 추가)
══════════════════ */
const DATA = {
  baby:  { name: '민준', ageMonths: 7 },
  week:  { num: 4, start: '2026.04.09', end: '2026.04.15', generated: '2026.04.15' },
  daily: [
    { day:'월', sleep:710, temp:22.3, bedtime:'21:30', wake:'06:45', tossTime:'02:15, 05:00', tossCnt:2, tossMin:25 },
    { day:'화', sleep:745, temp:22.1, bedtime:'21:00', wake:'06:30', tossTime:'03:00', tossCnt:1, tossMin:15 },
    { day:'수', sleep:630, temp:23.5, bedtime:'22:00', wake:'06:30', tossTime:'01:30, 03:45, 05:10', tossCnt:3, tossMin:55 },
    { day:'목', sleep:780, temp:21.8, bedtime:'21:15', wake:'06:50', tossTime:'04:20', tossCnt:1, tossMin:10 },
    { day:'금', sleep:700, temp:22.0, bedtime:'21:30', wake:'06:20', tossTime:'02:40, 04:10', tossCnt:2, tossMin:35 },
    { day:'토', sleep:785, temp:21.5, bedtime:'21:00', wake:'07:00', tossTime:'03:15', tossCnt:1, tossMin:20 },
    { day:'일', sleep:690, temp:22.2, bedtime:'21:45', wake:'06:30', tossTime:'01:50, 04:30', tossCnt:2, tossMin:40 },
  ],
  solution: {
    title: '✨ 추천 솔루션: "쉬닥법"을 활용한 연장 수면 가이드',
    reason: '민준이는 수요일 새벽, 실내 온도 23.5도로 인해 깬 이후 다시 혼자 잠드는 것(Self-soothing)에 큰 어려움을 겪은 것으로 분석됩니다. 당장 퍼버법(울리기)을 적용하기보다, 부모의 개입을 서서히 줄여나가는 "쉬닥법"이 적합합니다.',
    steps: [
      '수면 환경 리셋: 잠들기 30분 전 방 온도를 <strong>21~22도</strong>로 서늘하게 맞추고, 일정 데시벨(40dB)의 백색소음기를 켭니다.',
      '초기 개입: 아이를 눕히고 칭얼거리기 시작할 때 <strong>바로 안아올리지 마세요.</strong> 옆에 앉아 일정한 리듬으로 가슴을 토닥이며 조용히 "쉬-" 소리를 내어 진정시킵니다.',
      '빠지기 타이밍: 아이가 울음을 멈추고 하품을 하거나 눈이 감기기 시작하는 <strong>\'몽롱한 상태\'일 때 스킨십을 멈추고</strong> 조용히 방을 빠져나옵니다.'
    ]
  },
  dataTips: [
    {
      type: 'caution',
      icon: '🌡️',
      title: '수요일 수면 중단 원인: 실내 온도 상승',
      text: '수요일 실내 온도가 23.5도로 오르며 평소 15분이던 뒤척임이 55분으로 3배 이상 폭증했습니다. 7개월 아이에게 가장 쾌적한 수면 온도는 어른이 약간 서늘하다고 느끼는 21~22도입니다. 실내 환기와 얇은 이불을 활용해 온도를 낮춰주세요.'
    },
    {
      type: 'good',
      icon: '⏰',
      title: '안정적인 취침 시간 배려 (아주 훌륭해요!)',
      text: '일주일 내내 21:00~22:00 사이의 일관된 취침 시간을 지켜주고 계십니다. 일정한 수면 의식을 통해 지금의 좋은 리듬을 계속 유지해 주시는 것이 분리불안 시기 극복에 가장 큰 도움이 됩니다.'
    }
  ],
  kick: {
    title: '7개월 차 원더윅스 및 분리불안 대처법',
    text: '7개월 시기의 아이들은 인지능력이 급격히 발달하며 시야에서 보호자가 사라지는 것을 크게 두려워합니다(분리불안). 자다 깼을 때 부모가 없으면 공포를 느껴 크게 울 수 있습니다. 낮 시간에 "까꿍 놀이"나 숨바꼭질을 자주 하여, 엄마가 안 보여도 곧 다시 나타난다는 믿음(대상영속성)을 강하게 심어주세요. 수면의 질이 크게 개선될 수 있습니다.'
  }
};

/* ══════════════════
   유틸
══════════════════ */
function fmtMin(m) {
  const h = Math.floor(m / 60), mm = m % 60;
  return mm > 0 ? `${h}h ${mm}m` : `${h}h`;
}
function avgNum(arr, key) {
  return arr.reduce((s, d) => s + d[key], 0) / arr.length;
}
function avgTime(arr, key) {
  const mins = arr.map(d => {
    const [h, m] = d[key].split(':').map(Number);
    return h * 60 + m;
  });
  const avg = Math.round(mins.reduce((a, b) => a + b, 0) / mins.length);
  const h = Math.floor(avg / 60) % 24;
  const m = avg % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

/* ══════════════════
   렌더링
══════════════════ */
(function render() {
  const d = DATA;
  
  // 헤더
  document.getElementById('hd-title').textContent = `${d.baby.name}이 (${d.baby.ageMonths}개월) — ${d.week.num}주차 가이드`;
  document.getElementById('hd-sub').textContent = `데이터: ${d.week.start} ~ ${d.week.end}`;

  // 상단 요약 데이터
  const avgSleep = Math.round(avgNum(d.daily, 'sleep'));
  const avgTemp  = avgNum(d.daily, 'temp').toFixed(1);
  const avgBed   = avgTime(d.daily, 'bedtime');

  document.getElementById('s-sleep').textContent = fmtMin(avgSleep);
  document.getElementById('s-bed').textContent   = avgBed;
  document.getElementById('s-temp').textContent  = `${avgTemp}°C`;

  // 콤팩트 데일리 테이블
  document.getElementById('data-tbody').innerHTML = d.daily.map(day => {
    const isHigh = day.temp >= 23;
    return `
      <tr>
        <td class="td-day">${day.day}</td>
        <td>${day.bedtime} ~ ${day.wake}</td>
        <td>${fmtMin(day.sleep)}</td>
        <td style="color:var(--slate); font-size:10px;">${day.tossTime}</td>
        <td><span style="color:#D25E4A; font-weight:700;">${day.tossCnt}회</span> <span style="font-size:10.5px">(${day.tossMin}분)</span></td>
        <td class="${isHigh ? 'td-temp-high' : ''}">${day.temp}°</td>
      </tr>
    `;
  }).join('');

  // AI 솔루션 영역
  document.getElementById('ai-sol-title').textContent = d.solution.title;
  document.getElementById('ai-sol-reason').textContent = d.solution.reason;
  
  document.getElementById('ai-steps').innerHTML = d.solution.steps.map((step, idx) => `
    <div class="ai-step">
      <div class="step-num">${idx + 1}</div>
      <div class="step-text">${step}</div>
    </div>
  `).join('');

  // 데이트 맞춤 팁 영역
  document.getElementById('data-tips').innerHTML = d.dataTips.map(tip => `
    <div class="tip-box ${tip.type}">
      <div class="tip-icon">${tip.icon}</div>
      <div class="tip-content">
        <div class="tip-title">${tip.title}</div>
        <div class="tip-text">${tip.text}</div>
      </div>
    </div>
  `).join('');

  // 킥 영역
  document.getElementById('kick-title').textContent = d.kick.title;
  document.getElementById('kick-text').textContent = d.kick.text;

  // 푸터
  document.getElementById('footer-r').textContent = `리포트 생성일: ${d.week.generated}`;
})();
</script>
</body>
</html>
