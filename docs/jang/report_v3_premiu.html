<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mom-i 수면 리포트 (Premium Ver. - Mobile 2Pages)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Premium High-end Palette (Oura / Apple Health vibe) */
      --black: #0F0F0F;
      --charcoal: #1C1C1E;
      --gray-dark: #3A3A3C;
      --gray-mut: #8E8E93;
      --gray-lt: #E5E5EA;
      --bg-color: #FFFFFF;
      --surface: #F2F2F7;

      --accent-1: #24614A;
      /* Deep Forest Green for Good/Calm */
      --accent-1-lt: #E5EFEB;
      --accent-2: #A26038;
      /* Muted Bronze/Terracotta for alerts/accents */
      --accent-2-lt: #F6EFEA;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #E5E5EA;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--black);
      -webkit-font-smoothing: antialiased;
    }

    /* ── 컨트롤 바 ── */
    .ctrl {
      width: 100%;
      max-width: 430px;
      background: var(--bg-color);
      border-radius: 6px;
      padding: 12px 16px;
      margin: 16px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--gray-lt);
    }

    .ctrl span {
      flex: 1;
      font-size: 11px;
      color: var(--gray-mut);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'Inter', sans-serif;
    }

    .ctrl button {
      padding: 6px 12px;
      background: var(--black);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── 모바일 기반 앱 뷰 (430px Max) ── */
    .report-container {
      width: 100%;
      max-width: 430px;
      background: var(--bg-color);
      box-shadow: 0 10px 40px rgba(0, 0, 0, .05);
      display: flex;
      flex-direction: column;
    }

    .page-box {
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── 헤더 ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--black);
    }

    .brand-name {
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 500;
      color: var(--black);
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 9px;
      color: var(--gray-mut);
      margin-top: 4px;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .header-info {
      text-align: right;
    }

    .header-main {
      font-size: 13px;
      font-weight: 500;
      color: var(--black);
      letter-spacing: -0.3px;
    }

    .header-sub {
      font-size: 10px;
      color: var(--gray-mut);
      margin-top: 6px;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── 공통 타이틀 ── */
    .sec-title {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-mut);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--gray-lt);
      padding-bottom: 8px;
    }

    /* ── 1. 데이터 영역 ── */
    .compact-stats {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .c-stat-row {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--surface);
      border-radius: 8px;
    }

    .c-stat-label {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      color: var(--gray-dark);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .c-stat-value {
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 400;
      color: var(--black);
    }

    .table-scroll {
      width: 100%;
      overflow-x: auto;
    }

    .compact-table {
      width: 100%;
      min-width: 340px;
      border-collapse: collapse;
      text-align: left;
      font-size: 12px;
    }

    .compact-table th {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      color: var(--gray-mut);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 10px;
      padding: 12px 8px;
      border-bottom: 1px solid var(--black);
    }

    .compact-table td {
      padding: 12px 8px;
      color: var(--black);
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      border-bottom: 1px solid var(--gray-lt);
    }

    .compact-table tr:last-child td {
      border-bottom: none;
    }

    .compact-table td.td-day {
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 500;
      color: var(--gray-dark);
    }

    .td-temp-high {
      color: var(--accent-2);
      font-weight: 600;
    }

    /* AI 종합 의견 */
    .summary-box {
      margin-top: 16px;
      padding: 20px;
      background: var(--black);
      color: var(--bg-color);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.7;
      font-weight: 300;
    }

    .summary-box strong {
      color: #FFF;
      font-weight: 500;
    }

    .summary-label {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      color: var(--gray-mut);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      display: block;
    }

    /* ── 2. 솔루션 영역 ── */
    .ai-sol-wrap {
      margin-top: 8px;
    }

    .ai-sol-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--black);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .ai-sol-reason {
      font-size: 13px;
      color: var(--gray-dark);
      line-height: 1.7;
      margin-bottom: 24px;
      font-weight: 300;
    }

    .ai-steps {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ai-step {
      display: flex;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--gray-lt);
    }

    .ai-step:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .step-num {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 15px;
      color: var(--gray-mut);
      width: 24px;
      flex-shrink: 0;
      padding-top: 2px;
    }

    .step-text {
      font-size: 13px;
      color: var(--black);
      line-height: 1.7;
      font-weight: 400;
    }

    .step-text strong {
      color: var(--black);
      font-weight: 700;
      background: linear-gradient(180deg, transparent 60%, var(--gray-lt) 40%);
    }

    /* ── 3. 분석 팁 & 킥 (모바일 1단) ── */
    .grid-wrap {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-top: 8px;
    }

    .tip-box {
      padding: 16px 20px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .tip-box:last-child {
      margin-bottom: 0;
    }

    .tip-box.caution {
      background: var(--accent-2-lt);
      border-left: 2px solid var(--accent-2);
    }

    .tip-box.good {
      background: var(--accent-1-lt);
      border-left: 2px solid var(--accent-1);
    }

    .tip-label {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .tip-box.caution .tip-label {
      color: var(--accent-2);
    }

    .tip-box.good .tip-label {
      color: var(--accent-1);
    }

    .tip-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--black);
      margin-bottom: 6px;
    }

    .tip-text {
      font-size: 12px;
      color: var(--gray-dark);
      line-height: 1.6;
      font-weight: 300;
    }

    .kick-wrap {
      padding: 20px;
      background: var(--surface);
      border-radius: 8px;
    }

    .kick-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--black);
      margin-bottom: 12px;
    }

    .kick-text {
      font-size: 12.5px;
      color: var(--gray-dark);
      line-height: 1.7;
      font-weight: 300;
    }

    /* ── 광고 지면 ── */
    .ad-banner {
      width: 100%;
      height: 80px;
      background: #000;
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 10px;
      letter-spacing: 2px;
      margin-top: 16px;
      border-radius: 8px;
      text-transform: uppercase;
    }

    /* ── 푸터 ── */
    .footer {
      padding: 20px 24px;
      border-top: 1px solid var(--gray-lt);
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: center;
      font-size: 9px;
      color: var(--gray-mut);
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.5px;
    }

    /* ── 🖨️ PDF/인쇄 (A4 사이즈 2페이지 대응) ── */
    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      body {
        background: #fff;
        padding: 0;
        margin: 0;
      }

      .ctrl {
        display: none;
      }

      .ad-banner {
        display: none;
      }

      .report-container {
        width: 210mm;
        max-width: none;
        box-shadow: none;
        display: block;
        margin: 0 auto;
      }

      .page-box {
        width: 210mm;
        height: 297mm;
        padding: 20mm 24mm;
        box-sizing: border-box;
        page-break-after: always;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      .page-box:last-child {
        page-break-after: auto;
      }

      .compact-stats {
        flex-direction: row;
      }

      .c-stat-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .grid-wrap {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 32px;
      }

      .footer {
        flex-direction: row;
        justify-content: space-between;
        position: absolute;
        bottom: 20mm;
        left: 24mm;
        right: 24mm;
        padding: 0;
        border-top: none;
      }
    }
  </style>
</head>

<body>

  <div class="ctrl">
    <span>Premium Report (Mobile)</span>
    <button onclick="window.print()">Export 2 Pages</button>
  </div>

  <div class="report-container" id="app"></div>

  <script>
    const mockData = {
      baby: { name: '민준', ageMonths: 7 },
      week: { num: 4, start: '2026.04.09', end: '2026.04.15', generated: '2026.04.15' },
      ai_summary: '이번 주 평균 수면 시간은 11시간 30분으로 권장량에 약간 못 미칩니다. 특히 수요일의 경우 <strong>높은 실내 온도로 인한 수면 질 저하</strong> 패턴이 뚜렷하게 관찰되었습니다. 반면, 부모님의 일관된 취침 시간 유지 노력은 안정적인 리듬 형성에 크게 기여하고 있습니다.',
      daily: [
        { day: '월', sleep: 710, temp: 22.3, bedtime: '21:30', wake: '06:45', tossTime: '02:15, 05:00', tossCnt: 2, tossMin: 25 },
        { day: '화', sleep: 745, temp: 22.1, bedtime: '21:00', wake: '06:30', tossTime: '03:00', tossCnt: 1, tossMin: 15 },
        { day: '수', sleep: 630, temp: 23.5, bedtime: '22:00', wake: '06:30', tossTime: '01:30, 03:45, 05:10', tossCnt: 3, tossMin: 55 },
        { day: '목', sleep: 780, temp: 21.8, bedtime: '21:15', wake: '06:50', tossTime: '04:20', tossCnt: 1, tossMin: 10 },
        { day: '금', sleep: 700, temp: 22.0, bedtime: '21:30', wake: '06:20', tossTime: '02:40, 04:10', tossCnt: 2, tossMin: 35 },
        { day: '토', sleep: 785, temp: 21.5, bedtime: '21:00', wake: '07:00', tossTime: '03:15', tossCnt: 1, tossMin: 20 },
        { day: '일', sleep: 690, temp: 22.2, bedtime: '21:45', wake: '06:30', tossTime: '01:50, 04:30', tossCnt: 2, tossMin: 40 },
      ],
      sleep_guide: {
        method_name: '쉬닥법',
        title: '[ ACTION PLAN ] "쉬닥법"을 활용한 연장 수면 가이드',
        reason: '수요일 새벽, 실내 온도 상승(23.5도)으로 인해 깬 이후 다시 혼자 잠드는 것(Self-soothing)에 큰 어려움을 겪은 것으로 분석됩니다. 당장 퍼버법(울리기)을 적용하기보다, 부모의 개입을 서서히 줄여나가는 "쉬닥법"이 가장 안전하고 효과적입니다.',
        steps: [
          '잠들기 30분 전 방 온도를 <strong>21~22도</strong>로 서늘하게 맞추고 백색소음기를 가동합니다.',
          '칭얼거리기 시작할 때 안아올리지 않습니다. 옆에 앉아 일정한 리듬으로 가슴을 토닥이며 조용히 "쉬-" 소리를 내어 진정시킵니다.',
          '아이가 하품을 하거나 <strong>몽롱한 상태일 때 물리적 스킨십을 멈추고</strong> 조용히 방을 이탈합니다.'
        ]
      },
      ai_comment: [
        { type: 'caution', label: 'ALERT', title: '수요일 수면 중단 원인: 실내 온도 상승', text: '실내 온도가 23.5도로 오르며 뒤척임이 폭증했습니다. 7개월 아이 쾌적 온도는 21~22도입니다.' },
        { type: 'good', label: 'EXCELLENT', title: '안정적인 취침 시간 확보', text: '일주일 내내 21:00~22:00 사이의 취침 시간을 지켜주고 계십니다. 현재의 리듬을 반드시 유지해 주십시오.' }
      ],
      age_kick: {
        title: '7개월 차 분리불안 멘탈 케어',
        text: '7개월 시기 아이들은 인지능력이 발달하며 보호자가 시야에서 사라지는 것을 두려워합니다. 낮 시간에 "까꿍 놀이"를 반복하여, 부모가 잠시 안 보여도 곧 다시 나타난다는 굳건한 대상영속성을 심어주어야 합니다. 이는 야간 수면 질 향상에 직결됩니다.'
      }
    };

    function fmtMin(m) { const h = Math.floor(m / 60), mm = m % 60; return mm > 0 ? `${h}h ${mm}m` : `${h}h`; }
    function avgNum(arr, k) { return arr.reduce((s, d) => s + d[k], 0) / arr.length; }
    function avgTime(arr, k) {
      const mins = arr.map(d => { const [h, m] = d[k].split(':').map(Number); return h * 60 + m; });
      const avg = Math.round(mins.reduce((a, b) => a + b, 0) / mins.length);
      return `${String(Math.floor(avg / 60) % 24).padStart(2, '0')}:${String(avg % 60).padStart(2, '0')}`;
    }

    const d = mockData;
    const avgSleep = Math.round(avgNum(d.daily, 'sleep'));
    const avgTemp = avgNum(d.daily, 'temp').toFixed(1);
    const avgBed = avgTime(d.daily, 'bedtime');

    document.getElementById('app').innerHTML = `
  <!-- PAGE 1 -->
  <div class="page-box">
    <div class="header">
      <div>
        <div class="brand-name">MOM-I Intelligence</div>
        <div class="brand-sub">Premium Sleep Diagnostics</div>
      </div>
      <div class="header-info">
        <div class="header-main">${d.baby.name} (${d.baby.ageMonths}M)</div>
        <div class="header-sub">Week ${d.week.num} (${d.week.start})</div>
      </div>
    </div>

    <div>
      <div class="sec-title">Data Overview</div>
      <div class="compact-stats">
        <div class="c-stat-row">
          <span class="c-stat-label">Avg Sleep</span>
          <span class="c-stat-value">${fmtMin(avgSleep)}</span>
        </div>
        <div class="c-stat-row">
          <span class="c-stat-label">Avg Bedtime</span>
          <span class="c-stat-value">${avgBed}</span>
        </div>
        <div class="c-stat-row">
          <span class="c-stat-label">Avg Temp</span>
          <span class="c-stat-value">${avgTemp}°C</span>
        </div>
      </div>
      
      <div class="table-scroll">
        <table class="compact-table">
          <thead>
            <tr><th>Day</th><th>Sleep Window</th><th>Total Sleep</th><th>Toss & Turn</th><th>Temp</th></tr>
          </thead>
          <tbody>
            ${d.daily.map(day => `
              <tr>
                <td class="td-day">${day.day}</td><td>${day.bedtime} - ${day.wake}</td><td>${fmtMin(day.sleep)}</td>
                <td><strong>${day.tossCnt}</strong> (${day.tossMin}m)</td>
                <td class="${day.temp >= 23 ? 'td-temp-high' : ''}">${day.temp}°</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      
      <div class="summary-box">
        <span class="summary-label">Executive Summary</span>
        ${d.ai_summary}
      </div>
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="page-box">
    <div class="ai-sol-wrap">
      <div class="sec-title">Core Solution</div>
      <div class="ai-sol-title">${d.sleep_guide.title}</div>
      <div class="ai-sol-reason">${d.sleep_guide.reason}</div>
      <div class="ai-steps">
        ${d.sleep_guide.steps.map((step, idx) => `
          <div class="ai-step"><div class="step-num">0${idx + 1}</div><div class="step-text">${step}</div></div>
        `).join('')}
      </div>
    </div>

    <div class="grid-wrap">
      <div>
        <div class="sec-title">Key Insights</div>
        ${d.ai_comment.map(tip => `
          <div class="tip-box ${tip.type}">
            <div class="tip-label">${tip.label}</div>
            <div class="tip-title">${tip.title}</div>
            <div class="tip-text">${tip.text}</div>
          </div>`).join('')}
      </div>

      <div>
        <div class="sec-title">Developmental Care</div>
        <div class="kick-wrap">
          <div class="kick-title">${d.age_kick.title}</div>
          <div class="kick-text">${d.age_kick.text}</div>
        </div>
      </div>
    </div>

    <!-- 모바일 및 앱 내 광고 영역 -->
    <div class="ad-banner">PREMIUM AD PLACEMENT</div>
  </div>

  <div class="footer">
    <span>© 2026 MOM-I INTELLIGENCE. ALL RIGHTS RESERVED.</span>
    <span>ISSUED: ${d.week.generated}</span>
  </div>
`;
  </script>
</body>

</html>
